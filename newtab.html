<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYSPACE OS</title><link rel="stylesheet" href="os.css"><script src="os.js" defer></script></head><body><div class="wallpaper"><div class="aurora"></div><div class="planet"></div><div class="grain"></div></div><div class="workspace"><header class="statusbar"><div class="identity"><span class="emblem">◈</span> MYSPACE <span class="subbrand">OS / EDITION 01</span></div><div class="system-meta"><span id="date"></span><span class="status-led"></span> LOCAL WORKSPACE</div></header><form id="webSearchForm" class="os-search" role="search"><div class="os-search-icon" aria-hidden="true">⌕</div><input id="webSearchInput" type="search" placeholder="در وب جست‌وجو کن..." aria-label="عبارت جست‌وجو" autocomplete="off" spellcheck="false" required><div class="search-engine-picker"><select id="searchEngine" class="search-engine-native" aria-label="موتور جست‌وجو" tabindex="-1"><option value="google">Google</option><option value="bing">Bing</option><option value="duckduckgo">DuckDuckGo</option><option value="brave">Brave</option><option value="ecosia">Ecosia</option><option value="startpage">Startpage</option></select><button id="engineToggle" class="search-engine-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="engineMenu" title="انتخاب موتور جست‌وجو"><img id="engineIcon" alt="" width="24" height="24"><span id="engineName">Google</span><span class="engine-chevron" aria-hidden="true">⌄</span></button><div id="engineMenu" class="search-engine-menu" role="group" aria-label="موتورهای جست‌وجو" hidden></div></div><button type="submit" aria-label="جست‌وجو">↗</button></form><section class="welcome"><div class="welcome-label">YOUR PERSONAL DIGITAL UNIVERSE</div><h1 id="hello">Your space.<br><em>Your rules.</em></h1><div class="welcome-time" id="clock"></div></section><section class="desktop" id="desktop" aria-label="Desktop applications"></section><section id="windowLayer" class="window-layer" aria-label="Application windows"></section></div><nav class="dock" aria-label="Dock"><button id="launcherButton" class="dock-start" title="All apps">◈</button><div class="dock-divider"></div><div id="dockApps" class="dock-apps"></div><div id="minimizedApps" class="minimized-apps" aria-label="Minimized windows"></div><div class="dock-divider"></div><button id="installButton" title="Install website">＋</button><button id="filesButton" title="Files">▤</button><button id="settingsButton" title="Settings">⚙</button></nav><div id="launcher" class="launcher hidden"><div class="launcher-head"><b>APPLICATION LIBRARY</b><button id="closeLauncher" aria-label="Close">✕</button></div><input id="appSearch" placeholder="جست‌وجوی برنامه / Search apps"><div id="launcherApps" class="launcher-grid"></div><button id="launcherInstall" class="launcher-install">＋ نصب وب‌سایت به‌عنوان اپ</button></div><dialog id="installDialog"><form method="dialog" id="installForm"><h2>نصب وب‌اپ / Install Web App</h2><label>نام برنامه<input id="installName" required maxlength="45" placeholder="مثلاً Spotify"></label><label>آدرس HTTPS<input id="installUrl" required type="url" placeholder="https://example.com"></label><label>آیکون برنامه<select id="iconMode"><option value="favicon">فاوآیکون خود سایت (پیش‌فرض)</option><option value="custom">آپلود آیکون دلخواه</option></select></label><label id="customIconRow" hidden>تصویر آیکون<input id="customIconFile" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="iconPreview" class="install-preview">◉</div><p>وب‌سایت در پنجره داخلی امتحان می‌شود؛ بعضی سایت‌ها آن را مسدود می‌کنند. گزینه بازکردن در تب مستقل همیشه در دسترس است.</p><div class="dialog-actions"><button value="cancel">انصراف</button><button id="confirmInstall" value="install">نصب</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><input id="filePicker" type="file" multiple hidden><input id="folderPicker" type="file" webkitdirectory multiple hidden></body></html>
