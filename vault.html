<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MySpace Secure Vault</title><link rel="stylesheet" href="vault.css"><script defer src="vault.js"></script></head><body><main><header><a href="newtab.html">← داشبورد</a><h1>◈ Secure Vault</h1><span>رمزگذاری محلی · بدون سرور</span></header><section id="gate" class="panel"><h2 id="gateTitle">باز کردن گاوصندوق</h2><p id="gateHelp">رمز اصلی را وارد کنید. در صورت فراموشی آن بازیابی ممکن نیست.</p><form id="gateForm"><input id="master" type="password" minlength="12" autocomplete="new-password" placeholder="Master password (حداقل ۱۲ کاراکتر)" required><button type="submit" id="gateSubmit">باز کردن</button></form></section><section id="work" hidden><div class="toolbar"><h2>حساب‌های ذخیره‌شده</h2><button id="lock">قفل کن</button></div><p class="warning">رمزها فقط به صورت رمزگذاری‌شده ذخیره می‌شوند. کپی ممکن است در تاریخچه کلیپ‌بورد Windows یا برنامه‌های دیگر باقی بماند؛ حذف کامل قابل تضمین نیست.</p><form id="entry" class="panel"><input id="site" placeholder="سایت (example.com)" required maxlength="150"><input id="username" placeholder="نام کاربری" autocomplete="off" maxlength="250" required><input id="password" type="password" placeholder="رمز عبور" autocomplete="new-password" required><button type="submit">ذخیره رمزگذاری‌شده</button></form><div id="items"></div><p id="copyStatus" role="status"></p></section><p id="status" role="status"></p></main></body></html>
